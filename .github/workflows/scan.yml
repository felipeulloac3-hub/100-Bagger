name: Weekly scan

on:
  schedule:
    # Sundays 06:00 UTC. Fundamentals move on filing dates, not on a weekly
    # clock, but filings arrive continuously across the market so a weekly
    # rescore picks each one up within days of it landing.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to scan instead of the full universe"
        required: false
        default: ""
      limit:
        description: "Cap the number of candidates (for a quick run)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      # SEC data is immutable once filed, so the cache saves the bulk of the
      # requests on every run after the first.
      - name: Restore SEC cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-

      - name: Scan
        env:
          # Required by SEC fair-access rules: must name a real contact.
          # Set as a repository variable under Settings > Secrets and variables > Actions.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT repository variable is not set."
            echo "SEC refuses requests without a User-Agent naming a contact address."
            echo "Set it to something like 'Your Name you@example.com'."
            exit 1
          fi
          python -m scanner.scan \
            --out reports \
            --limit "${{ github.event.inputs.limit || 0 }}" \
            --tickers "${{ github.event.inputs.tickers || '' }}"

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "no change in the report"
          else
            git commit -m "Scan $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summarize
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            head -40 reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
